# separate terms of service, privacy policy, and support
# documentation.

# pulled from repo
name: "Rubocop"

on:
  pull_request:

jobs:
  rubocop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUNDLE_WITHOUT: deployment # Capistrano and friends aren't needed to lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ruby from .ruby-version and RuboCop from Gemfile.lock, so CI checks with the versions people use locally
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run rubocop
        run: bundle exec rubocop
