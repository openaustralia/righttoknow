name: PR Review Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Run every hour to check for PRs that need auto-approval
    - cron: '0 * * * *'

jobs:
  assign-reviewers:
    name: Assign Team Reviewers
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    
    steps:
      - name: Request Review from Team
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            
            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: pullNumber,
                team_reviewers: ['team-right-to-know']
              });
              
              console.log(`Requested review from team-right-to-know for PR #${pullNumber}`);
            } catch (error) {
              console.error('Error requesting team review:', error);
              // Don't fail the workflow if team assignment fails
            }

  auto-approve:
    name: Auto-approve old PRs
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - name: Find and approve old PRs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            
            // Get all open PRs
            const prs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            
            const now = new Date();
            const fortyEightHoursAgo = new Date(now.getTime() - (48 * 60 * 60 * 1000));
            
            for (const pr of prs.data) {
              const prCreated = new Date(pr.created_at);
              
              // Skip draft PRs
              if (pr.draft) {
                console.log(`Skipping draft PR #${pr.number}`);
                continue;
              }
              
              // Skip if PR is less than 48 hours old
              if (prCreated > fortyEightHoursAgo) {
                continue;
              }
              
              // Check if PR has any reviews
              const reviews = await github.rest.pulls.listReviews({
                owner,
                repo,
                pull_number: pr.number
              });
              
              // Skip if PR already has reviews
              if (reviews.data.length > 0) {
                continue;
              }
              
              // Check if PR has required status checks passing
              const statusChecks = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: pr.head.sha
              });
              
              // Only auto-approve if status checks are successful or pending
              if (statusChecks.data.state === 'failure') {
                console.log(`Skipping PR #${pr.number} due to failed status checks`);
                continue;
              }
              
              try {
                // Auto-approve the PR
                await github.rest.pulls.createReview({
                  owner,
                  repo,
                  pull_number: pr.number,
                  event: 'APPROVE',
                  body: '🤖 Auto-approved after 48 hours without review. All status checks have passed.'
                });
                
                console.log(`Auto-approved PR #${pr.number} after 48 hours`);
                
                // Add a comment explaining the auto-approval
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: '✅ This PR has been automatically approved after 48 hours without review, as all required status checks have passed.\n\nIf you have concerns about this PR, please feel free to request changes or start a new review.'
                });
                
              } catch (error) {
                console.error(`Error auto-approving PR #${pr.number}:`, error);
              }
            }