name: "Help page link check"

# Checks the external links in the help pages and keeps one rolling issue up to
# date: opened or updated while there are hard failures, closed when there are
# none. Hard failures are DNS failures, refused or timed-out connections and
# 404. See .github/lychee.toml for the rules and the exclude list.

on:
  schedule:
    # Sunday 21:00 UTC, which is Monday morning in Australia.
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

env:
  ISSUE_LABEL: link-check
  ISSUE_TITLE: Broken external links in help pages

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .github/lychee.toml
            'lib/views/help/**/*'
          output: lychee/out.md
          jobSummary: true
          # Failing links are reported through the rolling issue, so the next
          # step decides whether the job fails.
          fail: false

      - name: Update rolling issue
        env:
          GH_TOKEN: ${{ github.token }}
          LYCHEE_EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Match the title as well as the label, so an unrelated issue that gets the label is never overwritten.
          existing=$(gh issue list --label "$ISSUE_LABEL" --state open --limit 100 --json number,title --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')

          case "$LYCHEE_EXIT_CODE" in
            0)
              if [ -n "$existing" ]; then
                gh issue close "$existing" --comment "No broken links found in the latest check: $RUN_URL"
              fi
              ;;
            2)
              {
                echo "The weekly check found external links in the help pages that fail with a DNS error, a refused or timed-out connection, or a 404."
                echo
                sed -n '/^## Errors per input/,$p' lychee/out.md
                echo
                echo "Checked by [this run]($RUN_URL). This issue closes itself when a check finds nothing."
                echo
                echo "If a link works in a browser but fails here, add its domain to \`exclude\` in \`.github/lychee.toml\` with a comment saying why."
              } > issue-body.md

              if [ -n "$existing" ]; then
                gh issue edit "$existing" --body-file issue-body.md
              else
                gh label create "$ISSUE_LABEL" --description "Broken external links found by the weekly check" --color "aaaaaa" 2>/dev/null || true
                gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body-file issue-body.md
              fi
              ;;
            *)
              echo "::error::lychee exited with code ${LYCHEE_EXIT_CODE:-unknown}, which is not a link result. Leaving the rolling issue as it is."
              exit 1
              ;;
          esac
