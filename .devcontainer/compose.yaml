# Development stack for the Right to Know theme.
#
# Covers the same services as openaustralia/alaveteli's docker-compose.yml, but
# is self-contained: Alaveteli itself is cloned into the `alaveteli` volume by
# .devcontainer/setup.sh, so the only checkout you need is this repository.
# Where a name differs from Alaveteli's, the service carries a comment saying
# why.
#
# Shared by `make`, plain `docker compose` (via ../compose.yaml) and the Dev
# Container. See "Docker development environment" in AGENTS.md.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # setup.sh clones Alaveteli on first run and is idempotent after that.
    command: >
      sh -c '/alaveteli-themes/righttoknow/.devcontainer/setup.sh &&
             cd /alaveteli && rm -f tmp/pids/server.pid &&
             bin/rails server -b 0.0.0.0'
    tty: true
    stdin_open: true
    environment:
      START_LIMIT: &start_limit ${START_LIMIT:-20m} # how long startup may take before it counts as failed; see "If the app won't start" in the README
      BUNDLE_PATH: /bundle/vendor
      DATABASE_URL: postgres://postgres:password@db/
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailhog:1025
      ALAVETELI_REPO: ${ALAVETELI_REPO:-https://github.com/openaustralia/alaveteli.git}
      ALAVETELI_BRANCH: ${ALAVETELI_BRANCH:-staging}
    ports:
      - '${RAILS_PORT:-3000}:3000'
    volumes:
      - ..:/alaveteli-themes/righttoknow:cached
      - alaveteli:/alaveteli
      # Data that goes with the database, apart from the clone so `make clean` keeps the two in step
      - storage:/alaveteli/storage
      - xapian:/alaveteli/lib/acts_as_xapian/xapiandbs
      - bundle:/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    # The first start clones Alaveteli, installs gems and loads sample data, which takes a while.
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:3000/"]
      interval: 5s
      start_period: *start_limit

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile
    # The app container's setup.sh installs gems, links the theme and migrates, so wait until the app answers,
    # giving up after the same START_LIMIT.
    command: >
      sh -c 'cd /alaveteli &&
             /alaveteli-themes/righttoknow/.devcontainer/wait-for-app.sh app "the app to finish setting up" curl -fs -o /dev/null http://app:3000/ &&
             bundle exec sidekiq'
    environment:
      START_LIMIT: *start_limit
      BUNDLE_PATH: /bundle/vendor
      DATABASE_URL: postgres://postgres:password@db/
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailhog:1025
    volumes:
      - ..:/alaveteli-themes/righttoknow:cached
      - alaveteli:/alaveteli
      - storage:/alaveteli/storage
      - xapian:/alaveteli/lib/acts_as_xapian/xapiandbs
      - bundle:/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: Dockerfile-postgres
    environment:
      - POSTGRES_PASSWORD=password
    ports:
      - "5432" # rarely needed from the host: a random port, see `make status`
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 60

  redis:
    image: redis:6.0.16 # production's version, Ubuntu 22.04's package
    command: redis-server
    ports:
      - "6379" # rarely needed from the host: a random port, see `make status`
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # Named for what it is, rather than "smtp": nothing here can send mail
  # anywhere. MailHog accepts everything Alaveteli sends and holds it for
  # you to read at http://localhost:1080 instead of delivering it.
  mailhog:
    image: mailhog/mailhog
    ports:
      - '${MAILHOG_PORT:-1080}:8025'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/"]
      interval: 2s
      retries: 30

volumes:
  alaveteli: {}
  bundle: {}
  postgres: {}
  storage: {} # raw emails and attachments
  xapian: {}  # the search index
  redis: {}
